name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    name: Lint & Typecheck & TS Tests
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install

      - run: pnpm lint
      - run: pnpm build:core && pnpm build:renderer
      - run: pnpm typecheck

      - name: TypeScript tests (core + renderer)
        run: |
          cd packages/core && npx vitest run
          cd ../renderer && npx vitest run
